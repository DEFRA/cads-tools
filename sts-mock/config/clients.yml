# Mock AWS STS callers (outbound identity federation) for local dev + GH Actions.
# Each client stands in for one calling service. Request a token with the
# client_credentials grant; the requested scope selects the audience (aud).
# The nested "https://sts.amazonaws.com/" claim mirrors the real AWS token shape.
# sub is the caller role ARN, as in real AWS tokens.
# Same token shape as a real CDP token, but with local values only:
# org_id o-local, aws_account 000000000000, principal_tags.Environment local.
# Token lifetime is 300 seconds, like real AWS.

# cads-bridge calling cads-data-service
- ClientId: "local-sts-cads-bridge"
  ClientSecrets:
    - "local-mock-secret"
  AllowedGrantTypes:
    - "client_credentials"
  AllowedScopes:
    - "sts.cads-data-service"
    - "sts.cads-bridge"
  AccessTokenType: "Jwt"
  AlwaysSendClientClaims: true
  ClientClaimsPrefix: ""
  AccessTokenLifetime: 300
  Claims:
    - Type: "https://sts.amazonaws.com/"
      ValueType: "json"
      Value: '{"org_id":"o-local","aws_account":"000000000000","ou_path":["o-local/r-local/ou-local/"],"source_region":"eu-west-2","principal_id":"arn:aws:iam::000000000000:role/cads-bridge","principal_tags":{"ServiceCode":"CAS","Organization":"DEFRA","Platform":"cdp","ServiceName":"cads-bridge","ServiceType":"Microservice","Service":"cads-bridge","Environment":"local"}}'
    - Type: "sub"
      Value: "arn:aws:iam::000000000000:role/cads-bridge"

# cads-data-service calling cads-bridge
- ClientId: "local-sts-cads-data-service"
  ClientSecrets:
    - "local-mock-secret"
  AllowedGrantTypes:
    - "client_credentials"
  AllowedScopes:
    - "sts.cads-data-service"
    - "sts.cads-bridge"
  AccessTokenType: "Jwt"
  AlwaysSendClientClaims: true
  ClientClaimsPrefix: ""
  AccessTokenLifetime: 300
  Claims:
    - Type: "https://sts.amazonaws.com/"
      ValueType: "json"
      Value: '{"org_id":"o-local","aws_account":"000000000000","ou_path":["o-local/r-local/ou-local/"],"source_region":"eu-west-2","principal_id":"arn:aws:iam::000000000000:role/cads-data-service","principal_tags":{"ServiceCode":"CAS","Organization":"DEFRA","Platform":"cdp","ServiceName":"cads-data-service","ServiceType":"Microservice","Service":"cads-data-service","Environment":"local"}}'
    - Type: "sub"
      Value: "arn:aws:iam::000000000000:role/cads-data-service"

# Negative test callers: each must be REJECTED by a receiving service.
# Wrong AWS organisation (ServiceName is valid, org_id is not trusted)
- ClientId: "local-sts-wrong-org"
  ClientSecrets:
    - "local-mock-secret"
  AllowedGrantTypes:
    - "client_credentials"
  AllowedScopes:
    - "sts.cads-data-service"
    - "sts.cads-bridge"
  AccessTokenType: "Jwt"
  AlwaysSendClientClaims: true
  ClientClaimsPrefix: ""
  AccessTokenLifetime: 300
  Claims:
    - Type: "https://sts.amazonaws.com/"
      ValueType: "json"
      Value: '{"org_id":"o-someoneelse","aws_account":"999999999999","ou_path":["o-local/r-local/ou-local/"],"source_region":"eu-west-2","principal_id":"arn:aws:iam::999999999999:role/cads-bridge","principal_tags":{"ServiceCode":"CAS","Organization":"DEFRA","Platform":"cdp","ServiceName":"cads-bridge","ServiceType":"Microservice","Service":"cads-bridge","Environment":"local"}}'
    - Type: "sub"
      Value: "arn:aws:iam::999999999999:role/cads-bridge"

